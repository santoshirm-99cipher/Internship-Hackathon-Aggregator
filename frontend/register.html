<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CareerConnect</title>

    <link rel="stylesheet" href="css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="register-page">

<div class="register-container">

    <div class="left">

        <h1>Internship & Hackathon Aggregator</h1>

        <p>
            Start your journey towards internships, hackathons,
            placements and career success.
        </p>

    </div>

    <div class="right">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="full_name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

</div>

<footer class="footer">

    <p>© 2026 Internship & Hackathon Aggregator</p>

    <p>Developed by Santoshi Mahadik</p>

</footer>

<script src="js/register.js"></script>

</body>

</html>
